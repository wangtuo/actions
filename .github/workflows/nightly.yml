# 演示：手动触发 + 复用工作流 + 定时任务 + 富参数输入
name: Nightly

on:
  schedule:
    - cron: "0 18 * * *"    # 每天 UTC 18:00
  workflow_dispatch:
    inputs:
      go-version:
        description: "Go 版本"
        required: false
        default: "1.22"
        type: choice
        options: ["1.21", "1.22", "1.23"]
      message:
        description: "自定义打印消息"
        required: false
        default: "nightly run"

jobs:
  say-hello:
    runs-on: ubuntu-latest
    steps:
      - name: 打印上下文
        env:
          MSG: ${{ inputs.message || 'scheduled run' }}
        run: |
          echo "触发事件: ${{ github.event_name }}"
          echo "消息: $MSG"
          echo "runner: $RUNNER_OS"

  call-reusable:
    uses: ./.github/workflows/reusable-go-test.yml
    with:
      go-version: ${{ inputs.go-version || '1.22' }}

  report:
    needs: call-reusable
    runs-on: ubuntu-latest
    steps:
      - name: 输出复用工作流的返回值
        run: echo "覆盖率: ${{ needs.call-reusable.outputs.coverage }}"
