# tag 触发的多平台发布：使用 GoReleaser 生成产物 + Changelog，
# 上传到 GitHub Release。仅演示用途，可按需接入 signing / homebrew tap 等。
name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write   # 创建 Release / 上传资产
  packages: write   # 发布容器包（若启用）

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # GoReleaser 需要完整历史用于 changelog

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
