# 完整功能的 Go + GitHub Actions CI：
# - 并发控制、缓存、多 OS/多 Go 版本矩阵
# - go vet / staticcheck / golangci-lint
# - 单元测试 + race + coverage 上传 (Codecov 可选) + Job Summary
# - 构建 artifact 上传
# - PR 提示（issue-comment 输出摘要）
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_bench:
        description: "是否执行 benchmark"
        required: false
        default: "false"

# 同一 PR/分支的旧运行会被自动取消
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  GO_DEFAULT: "1.22"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_DEFAULT }}
          cache: true

      - name: go vet
        run: go vet ./...

      - name: gofmt 检查
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then
            echo "以下文件未格式化:"
            echo "$diff"
            exit 1
          fi

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.60.3
          args: --timeout=5m

  test:
    name: Test (${{ matrix.os }} / go${{ matrix.go }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.21", "1.22"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: 运行测试（race + coverage）
        run: |
          go test -race -covermode=atomic -coverprofile=coverage.out ./...

      - name: 生成覆盖率摘要
        if: runner.os != 'Windows'
        run: |
          echo "### Coverage (${{ matrix.os }} / go${{ matrix.go }})" >> "$GITHUB_STEP_SUMMARY"
          go tool cover -func=coverage.out | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 上传覆盖率 artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}-go${{ matrix.go }}
          path: coverage.out
          if-no-files-found: warn
          retention-days: 7

  bench:
    name: Benchmark（可选）
    if: github.event_name == 'workflow_dispatch' && inputs.run_bench == 'true'
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_DEFAULT }}
          cache: true
      - name: go test -bench
        run: go test -bench=. -benchmem -run=^$ ./... | tee bench.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-result
          path: bench.txt

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: ".exe"
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_DEFAULT }}
          cache: true

      - name: 构建二进制
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p dist
          out="dist/hello-${GOOS}-${GOARCH}${{ matrix.ext }}"
          go build -trimpath \
            -ldflags "-s -w -X main.version=${GITHUB_SHA::7}" \
            -o "$out" ./cmd/hello
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: hello-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*
